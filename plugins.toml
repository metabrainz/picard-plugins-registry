trust_level = "trusted"
authors = [
  "Bob Swift",
]
added_at = "2026-01-03T00:35:27Z"
updated_at = "2026-10-11T18:45:46Z"
versioning_scheme = "semver"
homepage = "https://picard-plugins-user-guides.readthedocs.io/en/latest/keep_only_tags/user_guide.html"
license = "GPL-2.0-or-later"
license_url = "https://www.gnu.org/licenses/gpl-2.0.html"
long_description = """
**Use with caution, because any tags not included in the user's \"keep\" list will not be written to the output files.**
As always, it is recommended that you first test your setup on a **copy** of a small subset of files to ensure that
the results are as expected.

This plugin provides a different approach for the user to determine which tags are written to the output files by
Picard. If the user only wants to keep a small subset of the tags provided by MusicBrainz, they can specify only the
tags that they want to keep rather than develop a lengthy tagger script to remove all of the tags that they don't want.

Tags that you wish to keep are entered in a page in the options settings, with each tag on a separate line. Blank lines
will be ignored. The entries are not case-sensitive.

If a tag in the list ends with an asterisk (`*`), then it will keep any tags beginning with the tag. For example, if
your list contains \"`performer:*`\" then all tags beginning with \"`performer:`\" will be kept, such as
\"`performer:instrument`\" and \"`performer:vocals`\".

All tags that are removed will still be available as variables with \"`_ko_`\" prepended to the tag name. For example,
if you choose not to keep the \"`musicbrainz_trackid`\" tag, it will still be available to scripts as
\"`%_ko_musicbrainz_trackid%`\"."""
report_bugs_to = "https://github.com/rdswift/picard-plugin-keep-only-tags/issues"

