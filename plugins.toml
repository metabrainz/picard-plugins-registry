name = "ReplayGain 2.0"
description = "Calculates ReplayGain information for tracks and albums"
git_url = "https://github.com/metabrainz/picard-plugin-replaygain2.git"
categories = [
  "metadata",
  "ui",
]
trust_level = "official"
authors = [
  "complexlogic",
  "Philipp Wolfer",
]
