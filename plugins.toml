[[plugins]]
id = "key-wheel-converter"
uuid = "acc16641-5c1d-4589-9909-e411f816e3fb"
name = "Key Wheel Converter"
description = "Adds functions to convert between 'standard', 'camelot', 'open key' and 'traktor' key formats."
git_url = "https://github.com/rdswift/picard-plugin-key-wheel-converter"
categories = [
  "scripting",
]
trust_level = "trusted"
authors = [
  "Bob Swift",
]
added_at = "2025-12-20T03:35:29Z"
updated_at = "2026-10-11T18:45:47Z"
versioning_scheme = "semver"
homepage = "https://picard-plugins-user-guides.readthedocs.io/en/latest/key_wheel_converter/user_guide.html"
license = "GPL-2.0"
license_url = "https://www.gnu.org/licenses/gpl-2.0.txt"
long_description = """
Adds functions to convert between 'standard', 'camelot', 'open key' and 'traktor' key formats.
It adds four new scripting functions:

* **$key2camelot(key)** returns the key string `key` in camelot key format.
* **$key2openkey(key)** returns the key string `key` in open key format.
* **$key2standard(key[,symbols])** returns the key string `key` in standard key format. If the optional argument `symbols` is set, then the '♭' and '#' symbols will be used, rather than spelling out '-Flat' and '-Sharp'.
* **$key2traktor(key)** returns the key string `key` in traktor key format.

The `key` argument can be entered in any of the supported formats, such as '2B' (camelot), '6d' (open key), 'A♭ Minor' (standard with symbols), 'A-Flat Minor' (standard with text) or 'C#' (traktor).  If the `key` argument is not recognized as one of the standard keys in the supported formats, then an empty string will be returned."""
report_bugs_to = "https://github.com/rdswift/picard-plugin-key-wheel-converter/issues"

