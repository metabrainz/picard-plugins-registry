[[plugins]]
id = "script-logger"
uuid = "c32678a7-094b-4f9b-86f8-ff3a786cc9e4"
name = "Script Logger"
description = "This plugin provides a new script function `$logline()` to write entries to Picard's system log."
git_url = "https://github.com/rdswift/picard-plugin-script-logger"
categories = [
  "scripting",
  "other",
]
trust_level = "trusted"
authors = [
  "Bob Swift",
]
added_at = "2025-12-20T21:21:58Z"
updated_at = "2026-10-11T18:45:53Z"
versioning_scheme = "semver"
homepage = "https://picard-plugins-user-guides.readthedocs.io/en/latest/script_logger/user_guide.html"
license = "GPL-2.0"
license_url = "https://www.gnu.org/licenses/gpl-2.0.txt"
long_description = """
This plugin provides a new script function `$logline()` to write entries
to Picard's system log. By default, the log level is set at `Info`, but
any level can be used by providing the level as an optional second
parameter to the function.

The function is used as:

`$logline(text[,level])`

where `text` is the text to write to the log. The entry will be written
at log level `Info` by default, but this can be changed by specifying a
different level as an optional second parameter. Allowable log levels are:

- E (Error)
- W (Warning)
- I (Info)
- D (Debug)

If an unknown level is entered, the function will use the default `Info`
level."""
report_bugs_to = "https://github.com/rdswift/picard-plugin-script-logger/issues"

[plugins.description_i18n]
fr = "Ce plugin fournit une nouvelle fonction de script, `$logline()`, permettant d'enregistrer des entrées dans le journal système de Picard."
zh_CN = "此插件提供了一个新的脚本函数 `$logline()` 来写入条目到 Picard 的系统日志。"

[plugins.long_description_i18n]
fr = """
Ce plugin fournit une nouvelle fonction de script `$logline()` permettant d'écrire des entrées dans le journal système de Picard. Par défaut, le niveau de journalisation est défini sur `Info`, mais il est possible d'utiliser n'importe quel niveau en le spécifiant comme deuxième paramètre facultatif de la fonction.

La fonction s'utilise comme suit :

`$logline(texte[,niveau])`

où `texte` correspond au texte à écrire dans le journal. L'entrée sera écrite au niveau de journalisation `Info` par défaut, mais cela peut être modifié en spécifiant un niveau différent en tant que deuxième paramètre facultatif. Les niveaux de journalisation autorisés sont :

- E (Erreur) - W (Avertissement) - I (Info) - D (Débogage)

Si un niveau inconnu est saisi, la fonction utilisera le niveau par défaut `Info`."""
zh_CN = """
此插件提供了一个新的脚本函数 `$logline()` 来写入条目到 Picard 的系统日志。默认情况下，日志级别设置为 `Info`，但可以通过向函数提供级别作为可选的第二参数来使用任何级别。

该函数的使用方式为：

`$logline(text[,level])`

其中 `text` 是要写入日志的文本。条目默认以 `Info` 级别写入日志，但可以通过指定不同的级别作为可选的第二参数来更改。允许的日志级别是：

- E (错误) - W (警告) - I (信息) - D (调试)

