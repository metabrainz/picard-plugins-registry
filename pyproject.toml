[project]
name = "picard-plugins-registry"
description = "Maintenance tools for the official Picard plugins registry"
authors = [{name = "The MusicBrainz Team"}]
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
version = "1.0.0"
dependencies = [
    "markdown",
    "requests~=2.31",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.scripts]
registry = "registry_lib.cli:main"

[project.optional-dependencies]
git = [
    "pygit2>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-cov>=4.0",
    "ruff>=0.12.8",
    "ty>=0.0.21",
    "pre-commit>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E", "F", "W", "B", "I"]
ignore = ["B023", "E501", "Q"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
lines-after-imports = 2
order-by-type = true
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.uv]
default-groups = ["dev"]
package = true

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# tomli is only imported on Python < 3.11, tomli_w and pygit2 are optional
unresolved-import = "warn"
# Suppressions for optional imports (e.g. pygit2) are needed only when the
# module is absent; when it is installed the suppression is redundant. Since
# CI installs all extras but local dev may not, don't fail on redundant
# suppressions.
unused-ignore-comment = "ignore"

[tool.ty.src]
# Files copied from Picard source, not maintained here
exclude = ["registry_lib/picard/"]
